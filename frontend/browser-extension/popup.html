<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OfferPath</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="popup-container">
    <header class="header">
      <div class="logo">
        <svg width="24" height="24" viewBox="0 0 32 32" fill="none">
          <rect width="32" height="32" rx="8" fill="#6366f1"/>
          <path d="M8 20L14 14L18 18L24 10" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M20 10H24V14" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="8" cy="20" r="2" fill="white"/>
        </svg>
        <span>OfferPath</span>
      </div>
      <span id="status-badge" class="status disconnected">Offline</span>
    </header>

    <main class="main">
      <div id="current-job" class="current-job hidden">
        <h3>Current Job</h3>
        <div class="job-card">
          <div class="job-title" id="job-title">-</div>
          <div class="job-company" id="job-company">-</div>
          <div class="job-url" id="job-url">-</div>
        </div>
        <button id="save-btn" class="btn btn-primary">
          <span class="btn-text">Save Application</span>
        </button>
      </div>

      <div id="no-job" class="no-job">
        <div class="icon">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <rect x="3" y="4" width="18" height="16" rx="2"/>
            <path d="M3 10h18"/>
            <path d="M9 4v4"/>
            <path d="M15 4v4"/>
          </svg>
        </div>
        <p>No job detected on this page</p>
        <p class="hint">Visit a job listing page on LinkedIn, Indeed, or apply on company websites</p>
        <button id="capture-btn" class="btn btn-secondary">Capture from Page</button>
      </div>

      <div id="success-message" class="success-message hidden">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2">
          <circle cx="12" cy="12" r="10"/>
          <path d="M8 12l2 2 4-4"/>
        </svg>
        <p>Application Saved!</p>
        <p class="hint">Open OfferPath to view</p>
      </div>
    </main>

    <footer class="footer">
      <div class="stats">
        <div class="stat">
          <span class="stat-value" id="app-count">0</span>
          <span class="stat-label">Tracked</span>
        </div>
      </div>
      <a href="#" id="open-app" class="link">Open App →</a>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
