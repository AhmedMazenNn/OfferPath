<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OfferPath</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="header">
      <div class="logo">
        <svg width="24" height="24" viewBox="0 0 32 32" fill="none">
          <rect width="32" height="32" rx="8" fill="#6366f1"/>
          <path d="M8 20L14 14L18 18L24 10" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span>OfferPath</span>
      </div>
      <span id="status-badge" class="badge badge-disconnected">Offline</span>
    </header>

    <!-- Not Logged In -->
    <div id="auth-section" class="section hidden">
      <div class="auth-form">
        <input type="email" id="email-input" placeholder="Email" class="input" />
        <input type="password" id="password-input" placeholder="Password" class="input" />
        <div class="btn-group">
          <button id="submit-login" class="btn btn-primary">Sign In</button>
          <button id="submit-signup" class="btn btn-secondary">Sign Up</button>
        </div>
      </div>
    </div>

    <!-- Logged In - Main Content -->
    <div id="main-section" class="hidden">
      <!-- User Info -->
      <div class="user-bar">
        <span id="user-name" class="user-name"></span>
        <button id="logout-btn" class="link-btn">Logout</button>
      </div>

      <!-- Job Detected -->
      <div id="job-detected" class="section hidden">
        <div class="job-card">
          <div class="job-title" id="job-title">-</div>
          <div class="job-company" id="job-company">-</div>
          <div class="job-url" id="job-url">-</div>
          <button id="save-btn" class="btn btn-primary btn-full">Save Application</button>
        </div>
      </div>

      <!-- No Job -->
      <div id="no-job" class="section">
        <div class="empty-state">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <rect x="3" y="4" width="18" height="16" rx="2"/>
            <path d="M3 10h18"/>
          </svg>
          <p>No job detected</p>
        </div>
        
        <!-- Manual Entry -->
        <div class="manual-entry">
          <p class="label">Or enter manually:</p>
          <input type="text" id="manual-title" placeholder="Job Title" class="input" />
          <input type="text" id="manual-company" placeholder="Company Name" class="input" />
          <button id="manual-save-btn" class="btn btn-secondary btn-full">Save</button>
        </div>
        
        <button id="capture-btn" class="btn btn-outline btn-full">Detect from Page</button>
      </div>

      <!-- Success Message -->
      <div id="success-message" class="section success hidden">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2">
          <circle cx="12" cy="12" r="10"/>
          <path d="M8 12l2 2 4-4"/>
        </svg>
        <p>Saved!</p>
      </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
      <div class="stat">
        <span class="stat-value" id="app-count">0</span>
        <span class="stat-label">Applications</span>
      </div>
      <a href="#" id="open-app" class="link">Open App →</a>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
